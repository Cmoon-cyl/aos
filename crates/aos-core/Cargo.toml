[package]
name = "aos-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
repository.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
serde.workspace = true
serde_json.workspace = true
serde_jcs.workspace = true
jsonschema.workspace = true
# Match the validator's ECMA translation and regex backend for typed budget errors.
jsonschema-regex = "=0.59.0"
regex = "=1.13.1"
regex-automata = { version = "=0.4.18", default-features = false, features = ["std", "syntax", "nfa-thompson", "unicode"] }
referencing = { version = "=0.59.0", default-features = false }
sha2.workspace = true
uuid.workspace = true
