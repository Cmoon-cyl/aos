[build-system]
requires = ["maturin==1.15.0"]
build-backend = "maturin"

[project]
name = "aos-sdk"
dynamic = ["version"]
description = "AOS Python SDK with an in-process Rust core"
requires-python = ">=3.11"
license = "Apache-2.0"
readme = "README.md"
license-files = [
    "LICENSE",
    "THIRD_PARTY_NOTICES.md",
    "upstream/licenses/zenoh-LICENSE",
    "upstream/licenses/zenoh-NOTICE.md",
    "upstream/licenses/hiroz-LICENSE",
    "upstream/licenses/rcl-LICENSE",
    "upstream/licenses/rclpy-LICENSE",
    "upstream/licenses/rmw_zenoh-LICENSE",
    "vendor/zenoh/LICENSE",
    "vendor/zenoh/NOTICE.md",
    "vendor/zenoh/AOS-PATCH.md",
    "vendor/zenoh-link-tls/LICENSE",
    "vendor/zenoh-link-tls/NOTICE.md",
    "vendor/zenoh-link-tls/AOS-PATCH.md",
]

[tool.maturin]
manifest-path = "crates/aos-py/Cargo.toml"
python-source = "python"
module-name = "aos_sdk._native"
bindings = "pyo3"
features = ["pyo3/extension-module"]
locked = true
# Keep all workspace members with Cargo.lock; the cargo generator trims members.
sdist-generator = "git"
include = [
    { path = "vendor/zenoh/**/*", format = "sdist" },
    { path = "vendor/zenoh/.cargo_vcs_info.json", format = "sdist" },
    { path = "vendor/zenoh-link-tls/**/*", format = "sdist" },
    { path = "vendor/zenoh-link-tls/.cargo_vcs_info.json", format = "sdist" },
    { path = "config/**/*", format = "sdist" },
    { path = "upstream/zenoh-1.10.1-vendor-manifest.json", format = "sdist" },
    { path = "upstream/patches/zenoh-1.10.1-liveliness-history.patch", format = "sdist" },
    { path = "upstream/zenoh-history-gate.md", format = "sdist" },
    { path = "upstream/zenoh-link-tls-1.10.1-vendor-manifest.json", format = "sdist" },
    { path = "upstream/patches/zenoh-link-tls-1.10.1-private-roots.patch", format = "sdist" },
    { path = "scripts/check_zenoh_vendor.py", format = "sdist" },
    { path = "scripts/test_zenoh_vendor.py", format = "sdist" },
    { path = "scripts/check_zenoh_tls_vendor.py", format = "sdist" },
    { path = "scripts/test_zenoh_tls_vendor.py", format = "sdist" },
    { path = "upstream/zenoh-routing-order.md", format = "sdist" },
    { path = "upstream/zenoh-ext-callback-audit.md", format = "sdist" },
    { path = "scripts/test_zenoh_demux_scope.py", format = "sdist" },
]
