<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">AOS</title>
  <desc id="desc">连接不同机器上的 Agent 与程序。Rust core、Zenoh、Python SDK 和 JSON CLI。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a1526"/><stop offset="1" stop-color="#172d3d"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5de2cc"/><stop offset="1" stop-color="#81acff"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#a7c2d7" opacity=".12"/>
    </pattern>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#bg)"/>
  <rect width="1200" height="360" rx="24" fill="url(#grid)"/>
  <path d="M0 359h1200" stroke="url(#line)" stroke-width="3"/>
  <g font-family="-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif">
    <text x="64" y="73" fill="#76dccc" font-size="13" font-weight="600" letter-spacing="3">CONNECTED CAPABILITIES</text>
    <text x="58" y="179" fill="#f4f8fc" font-size="104" font-weight="750" letter-spacing="-5">AOS</text>
    <text x="64" y="230" fill="#dde8f0" font-size="25" font-weight="500">让 Agent 与程序，跨机器协作。</text>
    <text x="65" y="287" fill="#9db3c4" font-size="15" letter-spacing=".5">DISCOVER  /  COMMUNICATE  /  ACT</text>
  </g>
  <g fill="none" stroke="url(#line)" stroke-width="2">
    <path d="M779 109L921 180L1082 105M921 180L1071 273M921 180L774 274" opacity=".6"/>
    <path d="M779 109Q858 38 1082 105M774 274Q940 330 1071 273" stroke-dasharray="4 7" opacity=".2"/>
    <circle cx="921" cy="180" r="58" opacity=".15"/>
    <circle cx="921" cy="180" r="43" fill="#122e3c" stroke="#5de2cc"/>
    <circle cx="779" cy="109" r="28" fill="#12283a" stroke="#81acff"/>
    <circle cx="1082" cy="105" r="24" fill="#12283a" stroke="#81acff"/>
    <circle cx="1071" cy="273" r="31" fill="#12283a" stroke="#81acff"/>
    <circle cx="774" cy="274" r="22" fill="#12283a" stroke="#81acff"/>
  </g>
  <g fill="#d8f7f0">
    <circle cx="921" cy="180" r="7"/><circle cx="779" cy="109" r="4"/>
    <circle cx="1082" cy="105" r="4"/><circle cx="1071" cy="273" r="4"/><circle cx="774" cy="274" r="4"/>
  </g>
</svg>
