name: Native Linux and Windows acceptance

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native:
    name: ${{ matrix.os }} / CPython 3.11 / x86_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 75
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    env:
      CARGO_BUILD_JOBS: "2"
      CARGO_TERM_COLOR: never
      RUST_BACKTRACE: "1"
    steps:
      - name: Check out the tested source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Set up CPython 3.11 x64
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"
          architecture: x64
      - name: Build, install, and verify the native artifacts
        run: python -I scripts/native_acceptance.py --output "${{ runner.temp }}/aos-native-acceptance"
      - name: Upload native CLI and SDK
        if: success()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: native-${{ matrix.os }}-cpython311-x86_64-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/aos-native-acceptance/cli/*
            ${{ runner.temp }}/aos-native-acceptance/wheels/*.whl
          if-no-files-found: error
          retention-days: 14
